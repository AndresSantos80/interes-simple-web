<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Interés Simple</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --success: #10b981;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            text-align: center;
            color: var(--accent);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        .formula-badge {
            background-color: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent);
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        select {
            width: 45%;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-calc {
            background-color: var(--accent);
            color: #0f172a;
        }

        .btn-calc:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        .btn-clear {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-clear:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }

        .results {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: none;
        }

        .results.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 12px;
            background-color: var(--bg-color);
            border-radius: 8px;
        }

        .result-item span.label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .result-item span.value {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--success);
        }

        .result-item.total span.value {
            color: var(--accent);
            font-size: 1.25rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculadora de Interés Simple</h1>
    <p class="subtitle">Simula rendimientos o costos financieros fácilmente</p>

    <div class="formula-badge">
        I = C × i × t &nbsp;|&nbsp; M = C + I
    </div>

    <form id="interestForm">
        <div class="form-group">
            <label for="capital">Capital Inicial (C)</label>
            <input type="number" id="capital" placeholder="Ej: 1000000" step="any" min="0" required>
        </div>

        <div class="form-group">
            <label for="rate">Tasa de Interés Anual (%)</label>
            <input type="number" id="rate" placeholder="Ej: 12.5" step="any" min="0" required>
        </div>

        <div class="form-group">
            <label for="time">Tiempo (t)</label>
            <div class="input-row">
                <input type="number" id="time" placeholder="Ej: 6" step="any" min="0" required>
                <select id="timeUnit">
                    <option value="years">Años</option>
                    <option value="months" selected>Meses</option>
                    <option value="days">Días (360)</option>
                </select>
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn-calc">Calcular</button>
            <button type="button" class="btn-clear" id="clearBtn">Limpiar</button>
        </div>
    </form>

    <div class="results" id="resultsBox">
        <div class="result-item">
            <span class="label">Interés Generado (I):</span>
            <span class="value" id="interestOutput">$0</span>
        </div>
        <div class="result-item total">
            <span class="label">Monto Final (M):</span>
            <span class="value" id="totalOutput">$0</span>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('interestForm');
    const clearBtn = document.getElementById('clearBtn');
    const resultsBox = document.getElementById('resultsBox');
    const interestOutput = document.getElementById('interestOutput');
    const totalOutput = document.getElementById('totalOutput');

    // Formateador de moneda (COP)
    const currencyFormatter = new Intl.NumberFormat('es-CO', {
        style: 'currency',
        currency: 'COP',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const capital = parseFloat(document.getElementById('capital').value);
        const annualRate = parseFloat(document.getElementById('rate').value) / 100;
        const time = parseFloat(document.getElementById('time').value);
        const unit = document.getElementById('timeUnit').value;

        if (isNaN(capital) || isNaN(annualRate) || isNaN(time)) return;

        // Convertir tiempo a años según la unidad elegida
        let timeInYears = time;
        if (unit === 'months') {
            timeInYears = time / 12;
        } else if (unit === 'days') {
            timeInYears = time / 360; // Año comercial estándar en finanzas
        }

        // Fórmula de interés simple: I = C * i * t
        const interest = capital * annualRate * timeInYears;
        const totalAmount = capital + interest;

        interestOutput.textContent = currencyFormatter.format(interest);
        totalOutput.textContent = currencyFormatter.format(totalAmount);

        resultsBox.classList.add('active');
    });

    clearBtn.addEventListener('click', function() {
        form.reset();
        resultsBox.classList.remove('active');
    });
</script>

</body>
</html>
