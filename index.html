<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Financiero | Interés Simple</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-page: #f1f5f9;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-gray: #475569;
            --border-color: #e2e8f0;
            --accent-bg: #eff6ff;
            --green: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 16px;
        }

        .wrapper {
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            padding: 28px 32px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .content {
            padding: 28px 32px;
        }

        .mode-selector {
            margin-bottom: 24px;
        }

        .mode-selector label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-gray);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        @media (min-width: 480px) {
            .tabs {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .tab-btn {
            padding: 10px 8px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            color: var(--text-gray);
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
        }

        .formula-pill {
            background: var(--accent-bg);
            color: var(--primary-dark);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 22px;
            border: 1px dashed #93c5fd;
        }

        .field {
            margin-bottom: 18px;
        }

        .field.hidden {
            display: none;
        }

        .field label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            color: var(--text-dark);
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        select {
            width: 45%;
            background-color: #f8fafc;
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-primary {
            flex: 2;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            flex: 1;
            background: #f1f5f9;
            color: var(--text-gray);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .result-panel {
            margin-top: 28px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            display: none;
        }

        .result-panel.visible {
            display: block;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (min-width: 480px) {
            .result-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .metric-card {
            background: white;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .metric-card span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-gray);
            margin-bottom: 4px;
        }

        .metric-card strong {
            font-size: 1.2rem;
            color: var(--green);
        }

        .metric-card.highlight strong {
            color: var(--primary);
        }

        .table-wrapper {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: white;
            margin-top: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: right;
        }

        th, td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: #f1f5f9;
            color: var(--text-gray);
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        th:first-child, td:first-child {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <h1>Calculadora de Interés Simple</h1>
        <p>Calcula intereses, monto final o despeja cualquier variable financiera</p>
    </div>

    <div class="content">
        <div class="mode-selector">
            <label>¿Qué deseas calcular?</label>
            <div class="tabs">
                <button type="button" class="tab-btn active" data-mode="interest">Interés (I)</button>
                <button type="button" class="tab-btn" data-mode="capital">Capital (C)</button>
                <button type="button" class="tab-btn" data-mode="rate">Tasa (i)</button>
                <button type="button" class="tab-btn" data-mode="time">Tiempo (t)</button>
            </div>
        </div>

        <div class="formula-pill" id="formulaDisplay">
            Fórmula: I = C × i × t &nbsp;|&nbsp; M = C + I
        </div>

        <form id="calcForm">
            <div class="field" id="fieldCapital">
                <label for="capital">Capital Inicial (C)</label>
                <input type="number" id="capital" placeholder="Ej: 2000000" step="any" min="0">
            </div>

            <div class="field hidden" id="fieldInterest">
                <label for="interest">Interés Generado (I)</label>
                <input type="number" id="interest" placeholder="Ej: 240000" step="any" min="0">
            </div>

            <div class="field" id="fieldRate">
                <label for="rate">Tasa de Interés Anual (%)</label>
                <input type="number" id="rate" placeholder="Ej: 12" step="any" min="0">
            </div>

            <div class="field" id="fieldTime">
                <label for="time">Plazo / Tiempo (t)</label>
                <div class="input-group">
                    <input type="number" id="time" placeholder="Ej: 12" step="any" min="0">
                    <select id="timeUnit">
                        <option value="months" selected>Meses</option>
                        <option value="years">Años</option>
                        <option value="days">Días (360)</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="btn-primary">Calcular Resultado</button>
                <button type="button" class="btn-secondary" id="resetBtn">Limpiar</button>
            </div>
        </form>

        <div class="result-panel" id="resultPanel">
            <div class="result-grid">
                <div class="metric-card highlight">
                    <span id="primaryLabel">Interés Total (I)</span>
                    <strong id="primaryValue">$0</strong>
                </div>
                <div class="metric-card">
                    <span id="secondaryLabel">Monto Final (M)</span>
                    <strong id="secondaryValue">$0</strong>
                </div>
            </div>

            <div id="scheduleSection">
                <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-gray);">Proyección por periodo (Año / Mes)</span>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Periodo</th>
                                <th>Interés</th>
                                <th>Acumulado</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentMode = 'interest';

    const formulas = {
        interest: 'Fórmula: I = C × i × t  |  M = C + I',
        capital:  'Fórmula: C = I / (i × t)',
        rate:     'Fórmula: i = I / (C × t)',
        time:     'Fórmula: t = I / (C × i)'
    };

    const cop = new Intl.NumberFormat('es-CO', {
        style: 'currency',
        currency: 'COP',
        minimumFractionDigits: 2
    });

    const tabs = document.querySelectorAll('.tab-btn');
    const formulaDisplay = document.getElementById('formulaDisplay');
    const resultPanel = document.getElementById('resultPanel');
    const scheduleSection = document.getElementById('scheduleSection');

    tabs.forEach(btn => {
        btn.addEventListener('click', () => {
            tabs.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.dataset.mode;
            formulaDisplay.textContent = formulas[currentMode];
            updateFields();
            resultPanel.classList.remove('visible');
        });
    });

    function updateFields() {
        document.getElementById('fieldCapital').classList.toggle('hidden', currentMode === 'capital');
        document.getElementById('fieldInterest').classList.toggle('hidden', currentMode === 'interest');
        document.getElementById('fieldRate').classList.toggle('hidden', currentMode === 'rate');
        document.getElementById('fieldTime').classList.toggle('hidden', currentMode === 'time');
    }

    function toYears(val, unit) {
        if (unit === 'months') return val / 12;
        if (unit === 'days') return val / 360;
        return val;
    }

    document.getElementById('calcForm').addEventListener('submit', (e) => {
        e.preventDefault();

        const C = parseFloat(document.getElementById('capital').value);
        const I = parseFloat(document.getElementById('interest').value);
        const r = parseFloat(document.getElementById('rate').value) / 100;
        const tRaw = parseFloat(document.getElementById('time').value);
        const unit = document.getElementById('timeUnit').value;
        const t = toYears(tRaw, unit);

        const pLabel = document.getElementById('primaryLabel');
        const pVal = document.getElementById('primaryValue');
        const sLabel = document.getElementById('secondaryLabel');
        const sVal = document.getElementById('secondaryValue');

        let calcC = C, calcI = I, calcR = r, calcT = t;

        if (currentMode === 'interest') {
            if (isNaN(C) || isNaN(r) || isNaN(t)) return alert('Completa todos los campos.');
            calcI = C * r * t;
            pLabel.textContent = 'Interés Generado (I)';
            pVal.textContent = cop.format(calcI);
            sLabel.textContent = 'Monto Final (M = C + I)';
            sVal.textContent = cop.format(C + calcI);
        } else if (currentMode === 'capital') {
            if (isNaN(I) || isNaN(r) || isNaN(t) || r === 0 || t === 0) return alert('Ingresa valores válidos mayores a 0.');
            calcC = I / (r * t);
            pLabel.textContent = 'Capital Inicial (C)';
            pVal.textContent = cop.format(calcC);
            sLabel.textContent = 'Monto Final (M = C + I)';
            sVal.textContent = cop.format(calcC + I);
        } else if (currentMode === 'rate') {
            if (isNaN(I) || isNaN(C) || isNaN(t) || C === 0 || t === 0) return alert('Ingresa valores válidos mayores a 0.');
            calcR = I / (C * t);
            pLabel.textContent = 'Tasa Anual (i)';
            pVal.textContent = (calcR * 100).toFixed(2) + ' %';
            sLabel.textContent = 'Tasa Mensual Equivalente';
            sVal.textContent = ((calcR / 12) * 100).toFixed(2) + ' %';
        } else if (currentMode === 'time') {
            if (isNaN(I) || isNaN(C) || isNaN(r) || C === 0 || r === 0) return alert('Ingresa valores válidos mayores a 0.');
            calcT = I / (C * r);
            pLabel.textContent = 'Tiempo en Años';
            pVal.textContent = calcT.toFixed(2) + ' años';
            sLabel.textContent = 'Equivalente en Meses';
            sVal.textContent = (calcT * 12).toFixed(1) + ' meses';
        }

        // Generar tabla de evolución (máximo 24 filas para mantener fluidez)
        const tbody = document.getElementById('scheduleBody');
        tbody.innerHTML = '';
        const periods = currentMode === 'interest' ? Math.min(Math.ceil(tRaw), 36) : Math.min(Math.ceil(calcT * 12), 36);

        if (periods > 0 && currentMode === 'interest') {
            scheduleSection.style.display = 'block';
            const stepInterest = calcI / tRaw;
            for (let p = 1; p <= periods; p++) {
                const currentInt = stepInterest * p;
                const row = `<tr>
                    <td>${p}</td>
                    <td>${cop.format(stepInterest)}</td>
                    <td>${cop.format(calcC + currentInt)}</td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            }
        } else {
            scheduleSection.style.display = 'none';
        }

        resultPanel.classList.add('visible');
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        document.getElementById('calcForm').reset();
        resultPanel.classList.remove('visible');
    });
</script>

</body>
</html>
